services:
  juice-shop:
    image: bkimminich/juice-shop:latest
    profiles: ["lab"]
    ports:
      - "127.0.0.1:3000:3000"

  dvwa:
    image: vulnerables/web-dvwa:latest
    profiles: ["lab"]
    ports:
      - "127.0.0.1:8081:80"

  webgoat:
    image: webgoat/webgoat:latest
    profiles: ["lab"]
    ports:
      - "127.0.0.1:8082:8080"
      - "127.0.0.1:9090:9090"

  custom-xss-lab:
    build: ./labs/custom
    profiles: ["lab"]
    ports:
      - "127.0.0.1:8084:8084"


  database:
    image: postgres:16-alpine
    profiles: ["stack"]
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: local-development-only
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    profiles: ["stack"]
    depends_on:
      database:
        condition: service_healthy
    environment:
      XSS_SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:local-development-only@database:5432/sentinel
      XSS_SENTINEL_AUTH_PROFILES: ${XSS_SENTINEL_AUTH_PROFILES:-}
      XSS_SENTINEL_WAF_SIGNATURES: ${XSS_SENTINEL_WAF_SIGNATURES:-}
      XSS_SENTINEL_FRONTIER_KEY: ${XSS_SENTINEL_FRONTIER_KEY:-}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    build: .
    profiles: ["stack"]
    command: ["python", "-m", "xss_sentinel.worker"]
    depends_on:
      app:
        condition: service_healthy
    environment:
      XSS_SENTINEL_DATABASE_URL: postgresql+psycopg://sentinel:local-development-only@database:5432/sentinel
      XSS_SENTINEL_AUTH_PROFILES: ${XSS_SENTINEL_AUTH_PROFILES:-}
      XSS_SENTINEL_FRONTIER_KEY: ${XSS_SENTINEL_FRONTIER_KEY:-}

  owasp-benchmark:
    image: owasp/benchmark:latest
    profiles: ["benchmark"]
    ports:
      - "127.0.0.1:8443:8443"

volumes:
  sentinel-postgres:
